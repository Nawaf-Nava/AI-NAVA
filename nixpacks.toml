# nixpacks.toml

[providers]
# إجبار Nixpacks على استخدام حزمة PHP التقليدية (Apache) بدلاً من FrankenPHP
php = "heroku"

[phases.setup]
# قائمة الحزم التي يجب تثبيتها على السيرفر
# aptPkgs هي الطريقة الصحيحة لمنصات مثل Railway التي تستخدم Nixpacks
aptPkgs = ["php-pgsql", "postgresql-client"]

[start]
# أمر بدء تشغيل سيرفر أباتشي وتوجيهه للمجلد العام
# تم التعديل ليكون متوافقاً مع Heroku Buildpack ويخدم من المجلد الحالي (.)
command = "heroku-php-apache2 ."
