# ملف إعدادات البناء لمنصة Railway
# https://nixpacks.com/docs/providers/php

[variables]
# فرض استخدام إصدار PHP 8.2 المستقر
PHP_VERSION = "8.2"
# إخبار Nixpacks بتثبيت الإضافات الضرورية لهذا الإصدار
NIX_PACKS_PHP_EXTENSIONS = "pdo_mysql,curl,mbstring,gd"

[start]
# أمر بدء التشغيل القياسي لخادم PHP على Railway
cmd = "php -S 0.0.0.0:8080 -t ."